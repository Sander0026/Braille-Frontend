<header class="pdf-viewer-header">
  <div class="header-titles">
    <h3 id="pdf-viewer-title">Visualizador Interativo de Documento</h3>
    <span class="mobile-zoom-hint">Dica: use os dois dedos na tela para dar zoom</span>
  </div>
  <button
    type="button"
    (click)="onClose()"
    class="btn-close"
    aria-label="Encerrar visualizacao do documento e fechar o modal"
    title="Fechar janela">
    <span aria-hidden="true">&times;</span>
  </button>
</header>

@if (carregando()) {
  <div class="pdf-loading" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <p>Carregando documento...</p>
  </div>
} @else if (mensagemErro()) {
  <div class="pdf-error" role="alert" aria-live="assertive">
    <span class="error-icon material-symbols-rounded" aria-hidden="true">error</span>
    <p>{{ mensagemErro() }}</p>
    <a class="btn-retry" [href]="url()" target="_blank" rel="noopener noreferrer">
      Abrir em nova aba
    </a>
  </div>
} @else if (urlVisualizadorPdf()) {
  <div class="pdf-frame-area">
    <iframe
      [src]="urlVisualizadorPdf() | safeUrl"
      title="Visualizacao interna de arquivo PDF">
    </iframe>
  </div>
}

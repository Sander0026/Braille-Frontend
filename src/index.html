<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Instituto Luiz Braille — ILBES</title>
  <meta name="description"
    content="Instituto de Educação Inclusiva Luiz Braille. Mais do que inclusão, transformação. Oferecendo oportunidades para pessoas com deficiência visual.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- theme-color: amarelo ILBES — identidade visual consistente com a paleta oficial -->
  <meta name="theme-color" content="#f5c800">

  <!-- Ícone e PWA Manifest -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Preconnect: inicia handshake DNS/TLS antecipado para Google Fonts (melhora LCP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonte Inter — carregada aqui (HTML) para máxima prioridade de preload.
       A declaração @import em _base.scss foi removida para evitar request duplicado. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Ícones Material Symbols -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet">

  <!-- Fontes para Assinaturas e Títulos de Certificados -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Parisienne&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Montserrat:wght@400;700&family=Merriweather:wght@400;700&family=Cinzel:wght@400;700&family=Dancing+Script:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
</head>

<body>
  <!-- O Skip-link de acessibilidade é gerido dentro de cada layout do Angular (admin, public, login)
       para garantir que os alvos da âncora existam e estejam dinamicamente disponíveis. -->
  <app-root></app-root>

  <!-- VLibras: Plugin de acessibilidade em Libras (Governo Federal Brasileiro) -->
  <div vw class="enabled" aria-hidden="true">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script>
    /* O script do VLibras ainda referencia assets do branch @dev no jsdelivr em algumas versoes.
       Em 08/05/2026, os assets access_icon.svg/access_popup.jpg entram em loop tanto
       no jsdelivr quanto via vlibras.gov.br. Substituimos esses recursos por imagens
       inline para evitar ruido no console sem impedir a inicializacao do widget. */
    (function patchVlibrasAssets() {
      const vlibrasIconSvg = 'data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2272%22 height=%2272%22 viewBox=%220 0 72 72%22%3E%3Crect width=%2272%22 height=%2272%22 rx=%2214%22 fill=%22%23005CA9%22/%3E%3Cpath d=%22M24 44c0 7 5 12 12 12h6c5 0 9-4 9-9V31c0-2-2-4-4-4s-4 2-4 4v8h-2V22c0-2-2-4-4-4s-4 2-4 4v17h-2V25c0-2-2-4-4-4s-4 2-4 4v17l-4-4c-2-2-4-2-6 0s-2 4 0 6l5 6z%22 fill=%22%23fff%22/%3E%3Ctext x=%2236%22 y=%2265%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-size=%2210%22 font-weight=%22700%22 fill=%22%23fff%22%3ELIBRAS%3C/text%3E%3C/svg%3E';
      const transparentGif = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
      const normalizeVlibrasUrl = function (value) {
        if (typeof value !== 'string') return value;
        if (/\/assets\/access_icon\.svg(?:[?#].*)?$/i.test(value)) return vlibrasIconSvg;
        if (/\/assets\/access_popup\.jpg(?:[?#].*)?$/i.test(value)) return transparentGif;
        return value;
      };

      const srcDescriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
      if (srcDescriptor && srcDescriptor.get && srcDescriptor.set) {
        Object.defineProperty(HTMLImageElement.prototype, 'src', {
          configurable: true,
          enumerable: srcDescriptor.enumerable,
          get: function () {
            return srcDescriptor.get.call(this);
          },
          set: function (value) {
            srcDescriptor.set.call(this, normalizeVlibrasUrl(value));
          }
        });
      }

      const originalSetAttribute = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function (name, value) {
        const shouldPatch = this instanceof HTMLImageElement && String(name).toLowerCase() === 'src';
        return originalSetAttribute.call(this, name, shouldPatch ? normalizeVlibrasUrl(value) : value);
      };
    })();
  </script>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    /* eslint-disable no-new */
    /* VLibras registra o widget via efeito colateral do construtor (API de terceiro).
       Guard defensivo: evita TypeError caso o script seja bloqueado por CSP ou falha de rede. */
    try {
      if (globalThis.VLibras && globalThis.VLibras.Widget) {
        new globalThis.VLibras.Widget('https://vlibras.gov.br/app');
      }
    } catch (e) {
      console.warn('[VLibras] Widget não pôde ser inicializado:', e);
    }
  </script>
</body>

</html>

<div class="autocomplete-wrapper">
  <label class="field" [for]="inputId">
    <span class="field__label">{{ label }}</span>
    <div class="field__input-row">
      <input
        [id]="inputId"
        type="search"
        [value]="termo()"
        (input)="onInputChange($event)"
        (keydown)="onKeydown($event)"
        placeholder="Busque por nome, CPF ou matricula"
        role="combobox"
        [attr.aria-expanded]="isOpen()"
        [attr.aria-controls]="listboxId"
        [attr.aria-activedescendant]="activeOptionId()"
        aria-autocomplete="list"
        aria-describedby="aluno-autocomplete-status"
        autocomplete="off"
        class="field__input"
        [class.field__input--has-value]="selecionado()"
        [class.field__input--selected]="selecionado()"
        [readonly]="!!selecionado()" />

      @if (selecionado()) {
        <button
          type="button"
          class="field__clear-btn"
          (click)="limpar()"
          aria-label="Remover aluno selecionado">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      } @else if (isLoading()) {
        <span class="field__spinner" aria-hidden="true"></span>
      }
    </div>
  </label>

  <p id="aluno-autocomplete-status" class="sr-only" aria-live="polite">{{ statusMessage() }}</p>

  @if (isListVisible()) {
    <div class="dropdown" role="region" aria-label="Resultados da busca">

      @if (isLoading()) {
        <div class="dropdown__status" role="status">
          <svg class="dropdown__status-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
          Buscando alunos...
        </div>

      } @else if (!resultados().length) {
        <div class="dropdown__status dropdown__status--empty" role="status">
          <svg class="dropdown__status-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          Nenhum aluno encontrado para "{{ termo() }}".
        </div>

      } @else {
        <ul
          class="dropdown__list"
          [id]="listboxId"
          role="listbox"
          aria-label="Resultados de alunos">
          @for (aluno of resultados(); track aluno.id; let i = $index) {
            <li
              role="option"
              [id]="optionId(i)"
              [attr.aria-selected]="activeIndex() === i"
              class="dropdown__item"
              [class.dropdown__item--active]="activeIndex() === i">
              <button
                type="button"
                class="dropdown__btn"
                (mouseenter)="activeIndex.set(i)"
                (click)="selecionar(aluno)">
                <strong class="dropdown__name">{{ aluno.nomeCompleto }}</strong>
              </button>
            </li>
          }
        </ul>
      }

    </div>
  }
</div>

<main class="page">
  <header>
    <div>
      <h1>Acompanhamentos finalizados</h1>
      <p>Consulte historicos encerrados e gere relatorios por periodo.</p>
    </div>
  </header>

  <section class="toolbar">
    <label>
      <span>Buscar</span>
      <input type="search" [(ngModel)]="busca" placeholder="Nome, matricula ou assunto" (keyup.enter)="carregar()" />
    </label>
    <button type="button" (click)="carregar()">Filtrar</button>
  </section>

  @if (carregando()) {
    <app-empty-state-atendimentos title="Carregando acompanhamentos" description="Aguarde enquanto buscamos os registros." />
  } @else if (erro()) {
    <app-empty-state-atendimentos title="Falha ao carregar acompanhamentos" [description]="erro()" />
  } @else if (acompanhamentos().length === 0) {
    <app-empty-state-atendimentos title="Nenhum acompanhamento finalizado" description="Quando houver encerramentos, eles aparecerao aqui." />
  } @else {
    <section class="grid">
      @for (acompanhamento of acompanhamentos(); track acompanhamento.id) {
        <app-acompanhamento-card [acompanhamento]="acompanhamento" />
      }
    </section>
  }
</main>

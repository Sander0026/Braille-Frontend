<article class="manual-card card-{{ manual.cor }} disponivel">

  <div class="manual-card-icon">
    <span class="material-symbols-rounded" aria-hidden="true">{{ manual.icon }}</span>
  </div>

  <div class="manual-card-body">
    <h3 class="manual-titulo">{{ manual.titulo }}</h3>
    <p class="manual-descricao">{{ manual.descricao }}</p>

  </div>

  <div class="manual-card-footer">
    <button class="btn btn-primary btn-sm" (click)="onAbrirLista()" [attr.aria-label]="'Abrir lista de manuais de ' + manual.titulo">
      <span class="material-symbols-rounded" aria-hidden="true">folder_open</span>
      Abrir manuais
    </button>
  </div>

</article>
